[package]
name = "large-bench"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
regex = { version = "1.11", default-features = false, features = ["perf", "unicode"] }
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
codegen-units = 1

